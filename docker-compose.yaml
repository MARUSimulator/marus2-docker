services:
  marus2_simulator:
    container_name: marus2_container
    image: ghcr.io/marusimulator/marus2-docker:latest
    build: .
    ipc: host
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.Xauthority
    volumes:
      # Enable X11 GUI passthrough (for RViz / rqt)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/tmp/.Xauthority
      # Shared folder for easy file exchange (ROS bags, configs) between host and container
      - ${HOME}/marus2_shared:/home/marus2_user/shared
      # Hardware device access (joysticks, sensors)
      - /dev:/dev
    # Automatically starts the ROS 2 adapter gRPC server on startup
    command: ["launch_adapter"]
